<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Information System</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-navy">
    <div class="container">
      <a class="navbar-brand fw-bold text-red" href="#">Student InfoSys</a>
    </div>
  </nav>

  <!-- Main Section -->
  <section class="py-5 bg-dark">
    <div class="container">
      <h2 class="text-red text-center mb-4">Manage Student Records</h2>

      <!-- Form -->
      <form id="studentForm" class="row g-3 mb-4">
        <div class="col-md-3">
          <input type="text" id="name" class="form-control" placeholder="Student Name" required>
        </div>
        <div class="col-md-3">
          <input type="text" id="roll" class="form-control" placeholder="Roll Number" required>
        </div>
        <div class="col-md-3">
          <input type="text" id="course" class="form-control" placeholder="Course" required>
        </div>
        <div class="col-md-3">
          <input type="number" step="0.01" id="cgpa" class="form-control" placeholder="CGPA" required>
        </div>
        <div class="col-md-3">
          <input type="text" id="year" class="form-control" placeholder="Year (e.g. 2nd Year)" required>
        </div>
        <div class="col-md-3">
          <input type="text" id="dept" class="form-control" placeholder="Department" required>
        </div>
        <div class="col-12 text-center">
          <button type="submit" id="submitBtn" class="btn btn-red">Add Student</button>
          <button type="button" id="cancelEditBtn" class="btn btn-outline-light d-none ms-2">Cancel</button>
        </div>
      </form>

      <!-- Search -->
      <div class="mb-3">
        <input type="text" id="searchBox" class="form-control" placeholder="Search by name or roll number...">
      </div>

      <!-- Table -->
      <table class="table table-bordered table-striped table-dark">
        <thead class="bg-navy text-white">
          <tr>
            <th>Name</th>
            <th>Roll No</th>
            <th>Course</th>
            <th>CGPA</th>
            <th>Year</th>
            <th>Department</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="studentTable">
          <!-- Dynamic rows will appear here -->
        </tbody>
      </table>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer-section text-center py-3 bg-black text-white">
    <p>&copy; 2026 Student InfoSys. All Rights Reserved.</p>
  </footer>

  <!-- jQuery + Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom Script -->
  <script>
    $(document).ready(function(){
      let editingId = null;

      function createStudentRow(id, name, roll, course, cgpa, year, dept) {
        return $(`
          <tr data-id="${id}">
            <td>${name}</td>
            <td>${roll}</td>
            <td>${course}</td>
            <td>${cgpa}</td>
            <td>${year}</td>
            <td>${dept}</td>
            <td>
              <button type="button" class="btn btn-sm btn-red edit">Edit</button>
              <button type="button" class="btn btn-sm btn-danger delete">Delete</button>
            </td>
          </tr>
        `);
      }

      function resetForm() {
        $("#studentForm")[0].reset();
        editingId = null;
        $("#submitBtn").text("Add Student");
        $("#cancelEditBtn").addClass("d-none");
      }

      // Add or Update Student
      $("#studentForm").submit(function(e){
        e.preventDefault();

        let name = $.trim($("#name").val());
        let roll = $.trim($("#roll").val());
        let course = $.trim($("#course").val());
        let cgpa = $.trim($("#cgpa").val());
        let year = $.trim($("#year").val());
        let dept = $.trim($("#dept").val());

        if (!name || !roll || !course || !cgpa || !year || !dept) {
          alert("Please fill in all student details.");
          return;
        }

        if (editingId !== null) {
          let row = $("#studentTable tr[data-id='" + editingId + "']");
          row.find("td:eq(0)").text(name);
          row.find("td:eq(1)").text(roll);
          row.find("td:eq(2)").text(course);
          row.find("td:eq(3)").text(cgpa);
          row.find("td:eq(4)").text(year);
          row.find("td:eq(5)").text(dept);
          row.hide().fadeIn(500);
        } else {
          let id = Date.now();
          let row = createStudentRow(id, name, roll, course, cgpa, year, dept);
          row.hide().appendTo("#studentTable").fadeIn(500);
        }

        resetForm();
      });

      // Delete Student
      $(document).on("click", ".delete", function(){
        $(this).closest("tr").fadeOut(300, function(){
          $(this).remove();
        });
      });

      // Edit Student
      $(document).on("click", ".edit", function(){
        let row = $(this).closest("tr");
        editingId = row.data("id");

        $("#name").val(row.find("td:eq(0)").text());
        $("#roll").val(row.find("td:eq(1)").text());
        $("#course").val(row.find("td:eq(2)").text());
        $("#cgpa").val(row.find("td:eq(3)").text());
        $("#year").val(row.find("td:eq(4)").text());
        $("#dept").val(row.find("td:eq(5)").text());

        $("#submitBtn").text("Update Student");
        $("#cancelEditBtn").removeClass("d-none");
        $("#name").focus();
      });

      $("#cancelEditBtn").on("click", function(){
        resetForm();
      });

      // Search Filter
      $("#searchBox").on("keyup", function(){
        let value = $(this).val().toLowerCase();
        $("#studentTable tr").filter(function(){
          $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1);
        });
      });
    });
  </script>
</body>
</html>
