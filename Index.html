<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gen AI Assignment Portal</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --accent-color: #58a6ff;
      --hover-bg: #21262d;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      max-width: 700px;
      width: 100%;
    }

    h1 {
      color: #ffffff;
      font-size: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.75rem;
      margin-bottom: 1.5rem;
    }

    p {
      color: #8b949e;
      margin-bottom: 2rem;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      text-decoration: none;
      color: var(--text-color);
      font-weight: 600;
      transition: all 0.2s ease-in-out;
    }

    .card:hover {
      background-color: var(--hover-bg);
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .card span {
      color: var(--accent-color);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Gen AI Assignment Projects</h1>
    <p>Select a project below to view its live preview:</p>

    <div class="list">
      <a class="card" href="./Bootstrap-Based Website/">
        Bootstrap Based Website <span>&rarr;</span>
      </a>
      <a class="card" href="./CSS3 and Responsive Design/">
        CSS3 Layout and Responsive Design <span>&rarr;</span>
      </a>
      <a class="card" href="./HTML5 Web Page development/">
        HTML5 Web Page Development <span>&rarr;</span>
      </a>
      <a class="card" href="./Integrated UI UX Project/">
        Interactive UI-UX Project <span>&rarr;</span>
      </a>
      <a class="card" href="./jQuery Interactive Web Application/">
        jQuery Interactive Web Application <span>&rarr;</span>
      </a>
    </div>
  </div>

</body>
</html>
